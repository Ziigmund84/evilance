<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page introuvable · Evilance</title>
  <link rel="icon" href="/evilance/assets/img/favicon.svg" type="image/svg+xml">
  <script>
    // Redirige les anciennes adresses d'articles (evilance.fr/mon-article/) vers la nouvelle page Article.
    (function () {
      var base = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
      var rest = location.pathname.slice(base.length).replace(/\/+$/, "");
      if (/^[a-z0-9-]{3,120}$/.test(rest)) { location.replace(base + "article.html?a=" + rest); return; }
      if (/[?&]page_id=140\b/.test(location.search) || rest === "blog") { location.replace(base + "blog.html"); return; }
      window.__base = base;
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0C2236; color: #fff; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: clamp(2rem, 6vw, 3.4rem); margin: 0 0 .3em; letter-spacing: -0.03em; }
    a { display: inline-block; margin-top: 18px; background: #FFCA4B; color: #0C2236; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 999px; }
  </style>
</head>
<body>
  <main>
    <h1>Cette porte est fermée.</h1>
    <p>La page demandée n’existe pas ou a changé d’adresse.</p>
    <a id="home" href="/">Revenir à l’accueil</a>
  </main>
  <script>document.getElementById("home").href = window.__base || "/";</script>
</body>
</html>
